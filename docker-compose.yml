services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hackathon
      POSTGRES_PASSWORD: hackathon
      POSTGRES_DB: hackathon
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackathon -d hackathon"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:5001:5001"
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql+psycopg://hackathon:hackathon@db:5432/hackathon
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && exec uvicorn main:app --host 0.0.0.0 --port 5001 --reload"

volumes:
  pgdata:
