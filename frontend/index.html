<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hackathon</title>
    <!-- Bootstrap 5.3 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#">Hackathon</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="#demo">Demo</a></li>
            <li class="nav-item"><a class="nav-link" href="http://127.0.0.1:5001/docs">API Docs</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <header class="py-5 bg-primary text-white text-center">
      <div class="container py-4">
        <h1 class="display-4 fw-bold">Hackathon Project</h1>
        <p class="lead mb-1">Bootstrap frontend · FastAPI backend · SQLite database</p>
        <p class="mb-4">
          Backend status:
          <span id="backend-status" class="badge bg-secondary">checking…</span>
        </p>
        <a href="#demo" class="btn btn-light btn-lg">Try the demo</a>
      </div>
    </header>

    <main>
      <section id="demo" class="py-5">
        <div class="container" style="max-width: 640px">
          <h2 class="mb-1">Items demo</h2>
          <p class="text-body-secondary mb-4">
            Everything below goes through the FastAPI backend and is stored in SQLite.
          </p>

          <form id="item-form" class="input-group mb-3">
            <input
              id="item-name"
              type="text"
              class="form-control"
              placeholder="New item name"
              required
              autocomplete="off"
            />
            <button class="btn btn-primary" type="submit">Add</button>
          </form>

          <ul id="item-list" class="list-group">
            <li class="list-group-item text-body-secondary">Loading…</li>
          </ul>
        </div>
      </section>
    </main>

    <footer class="py-4 bg-body-tertiary">
      <div class="container text-center text-body-secondary">
        <small>&copy; 2026 Hackathon Project</small>
      </div>
    </footer>

    <!-- Bootstrap 5.3 JS bundle (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
